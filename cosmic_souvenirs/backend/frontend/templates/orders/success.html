{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="alert alert-success" style="animation: fadeIn 1s;">
                <h1>✅ Успешно!</h1>
                <p class="lead">Платеж прошел! Заказ передан в обработку.</p>
                <div class="mt-4">
                    <a href="{% url 'orders:order_history' %}" class="btn btn-success btn-lg me-3">
                        История заказов
                    </a>
                    <a href="/" class="btn btn-primary btn-lg">Продолжить покупки</a>
                </div>
                <div class="mt-3 small text-muted">
                    <i>Переход через <span id="countdown">10</span> сек...</i>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// ЗАДЕРЖКА 10 СЕКУНД!
let timeLeft = 10;
const countdown = document.getElementById('countdown');

const timer = setInterval(() => {
    timeLeft--;
    countdown.textContent = timeLeft;

}, 1000);
</script>
{% endblock %}
