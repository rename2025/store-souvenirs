{% extends 'base.html' %}
{% block title %}Ошибка оплаты{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="alert alert-danger">
                <h1>❌ <i class="fas fa-times-circle"></i> Оплата не удалась</h1>
                <p>Попробуйте еще раз или выберите другой способ оплаты.</p>

                <a href="{% url 'orders:order_create' %}" class="btn btn-warning btn-lg mt-4">
                    <i class="fas fa-redo"></i> Повторить оплату
                </a>
                <a href="{% url 'catalog' %}" class="btn btn-primary btn-lg mt-4">
                    <i class="fas fa-shopping-bag"></i> В каталог
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
